<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VED CAPITAL REWA — Multi-Function Portal</title>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#687386;--brand:#0b6bcb;
  --brand2:#14b87a;--dark:#10233f;--line:#e5eaf2;--danger:#d64545;--warn:#d99b00;
  --shadow:0 8px 25px rgba(25,55,95,.08);--radius:16px
}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh}.top{height:64px;background:var(--dark);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:20px;letter-spacing:.3px}.brand small{display:block;font-size:10px;opacity:.7;letter-spacing:1px}
.top-actions{display:flex;gap:8px;align-items:center}.pill{padding:8px 12px;border-radius:20px;background:#ffffff18;border:1px solid #ffffff22;color:#fff}
.layout{display:flex;min-height:calc(100vh - 64px)}
.side{width:245px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.side h4{margin:12px 10px 8px;color:#8a94a6;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.nav{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#475269;margin:2px 0}
.nav:hover,.nav.active{background:#eaf3ff;color:var(--brand);font-weight:700}
.main{flex:1;padding:22px;max-width:1500px;margin:auto;width:100%}
.view{display:none}.view.active{display:block}
h1{font-size:27px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow)}
.metric{min-height:105px}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:24px;font-weight:800;margin-top:8px}.green{color:var(--brand2)}.red{color:var(--danger)}.blue{color:var(--brand)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section-title h2{font-size:18px;margin:0}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:white;font-weight:700}.btn.secondary{background:#edf3fa;color:#24415e}.btn.green{background:var(--brand2);color:#fff}.btn.danger{background:var(--danger)}.btn.small{padding:7px 10px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:#69758a;background:#f7f9fc;position:sticky;top:0}
.table-wrap{overflow:auto;max-height:430px;border:1px solid var(--line);border-radius:12px}
input,select,textarea{width:100%;border:1px solid #d8e0eb;border-radius:9px;padding:10px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#536076}.full{grid-column:1/-1}
.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf3fa;font-size:11px;color:#536076}.tag.ok{background:#e8f8f1;color:#11845b}.tag.pending{background:#fff4d7;color:#9a6b00}.tag.bad{background:#ffe9e9;color:#ad3333}
.notice{padding:12px 14px;border-radius:12px;background:#fff8df;border:1px solid #f3df9e;color:#705600;font-size:12px}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0e2441,#0b6bcb)}
.login-card{width:min(470px,100%);background:#fff;border-radius:22px;padding:26px;box-shadow:0 20px 60px #001a4038}.login-brand{text-align:center;margin-bottom:20px}.login-brand .logo{width:60px;height:60px;margin:auto;border-radius:16px;background:linear-gradient(135deg,#0b6bcb,#15bd80);display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}
.tabs{display:flex;background:#f0f4f9;border-radius:10px;padding:3px;margin:15px 0}.tab{flex:1;border:0;background:transparent;padding:9px;border-radius:8px}.tab.active{background:#fff;color:var(--brand);font-weight:800;box-shadow:0 2px 7px #0000000b}
.kicker{font-size:11px;color:var(--brand);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.hero{background:linear-gradient(120deg,#0e2949,#0b6bcb);color:#fff;border-radius:20px;padding:22px;margin-bottom:18px}.hero h1{margin-bottom:8px}.hero p{opacity:.85}
.search{position:relative}.search input{padding-left:38px}.search span{position:absolute;left:13px;top:10px}
.progress{height:8px;background:#e8edf4;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--brand2)}
.course{display:flex;gap:13px;align-items:center}.course-icon{width:48px;height:48px;border-radius:12px;background:#eaf3ff;display:grid;place-items:center;font-size:20px}
.price{font-weight:900;color:var(--brand)}
.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.action{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;text-align:left}.action b{display:block;margin-top:5px}.action span{font-size:20px}
canvas{width:100%;height:260px;border:1px solid var(--line);border-radius:12px;background:#fff}
.bar{display:flex;gap:4px;align-items:flex-end;height:150px;padding:12px}.bar i{flex:1;background:#4c91df;border-radius:4px 4px 0 0;min-height:5px}
.qr{width:170px;height:170px;border:8px solid #111;background:
repeating-conic-gradient(#111 0 12deg,#fff 12deg 24deg);display:grid;place-items:center}
.qr span{background:#fff;padding:7px;font-size:10px;font-weight:800}
.modal{position:fixed;inset:0;background:#00152b88;display:none;align-items:center;justify-content:center;z-index:50;padding:15px}.modal.show{display:flex}.modal-box{background:#fff;border-radius:18px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px}
.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:100}.toast.show{display:block}
.mobile-only{display:none}
@media(max-width:900px){.side{position:fixed;left:-260px;z-index:40;transition:.2s}.side.open{left:0}.mobile-only{display:block}.main{padding:14px}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.action-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3,.g4,.form-grid{grid-template-columns:1fr}.top .top-actions .pill{display:none}.hero h1{font-size:22px}.main{padding:10px}.card{padding:13px}}
</style>
</head>
<body>

<div id="login" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">VC</div>
      <h1 style="margin:10px 0 2px">VED CAPITAL REWA</h1>
      <div class="sub" style="margin:0">Capital • Learning • Partner Management</div>
    </div>
    <div class="tabs">
      <button class="tab active" data-login="student">Student / Learner</button>
      <button class="tab" data-login="partner">Partner</button>
      <button class="tab" data-login="employee">Employee</button>
      <button class="tab" data-login="admin">Admin</button>
    </div>
    <div id="loginForm">
      <div class="field"><label>Mobile Number</label><input id="loginMobile" placeholder="10 digit mobile number"></div>
      <div class="field" style="margin-top:10px"><label>Password</label><input id="loginPassword" type="password" placeholder="Password"></div>
      <button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Login</button>
      <button class="btn secondary" id="signupBtn" style="width:100%;margin-top:8px" onclick="openSignup()">New Student? Sign Up</button>
      <div class="notice" style="margin-top:13px">Demo portal: use any mobile/password. Admin approval, KYC, payment verification and real trading integrations should be connected before production.</div>
    </div>
  </div>
</div>

<div id="app" class="app" style="display:none">
<header class="top">
  <div class="row"><button class="btn secondary mobile-only" onclick="toggleSide()">☰</button><div class="brand">VED CAPITAL REWA<small>CAPITAL • LEARNING • PARTNERS</small></div></div>
  <div class="top-actions"><span class="pill" id="rolePill">Student</span><span class="pill" id="userPill">Demo User</span><button class="btn small" onclick="logout()">Logout</button></div>
</header>
<div class="layout">
<aside class="side" id="side">
  <h4>Main</h4>
  <button class="nav active" data-view="home">🏠 Dashboard</button>
  <button class="nav" data-view="profile">👤 Profile</button>
  <button class="nav" data-view="classes">🎓 Classes & Learning</button>
  <button class="nav" data-view="tasks">✅ Tasks & Earnings</button>
  <button class="nav" data-view="wallet">💰 Wallet & Withdrawal</button>
  <button class="nav" data-view="exam">🏆 Exam & Certificate</button>
  <button class="nav" data-view="reports">📈 Market Reports</button>
  <h4>Management</h4>
  <button class="nav" data-view="students">👨‍🎓 Students</button>
  <button class="nav" data-view="partners">🤝 Partners</button>
  <button class="nav" data-view="employees">🧑‍💼 Employees</button>
  <button class="nav" data-view="payments">💳 Payment Requests</button>
  <button class="nav" data-view="admin">⚙️ Admin Control</button>
</aside>

<main class="main">
<section id="home" class="view active"></section>
<section id="profile" class="view"></section>
<section id="classes" class="view"></section>
<section id="tasks" class="view"></section>
<section id="wallet" class="view"></section>
<section id="exam" class="view"></section>
<section id="reports" class="view"></section>
<section id="students" class="view"></section>
<section id="partners" class="view"></section>
<section id="employees" class="view"></section>
<section id="payments" class="view"></section>
<section id="admin" class="view"></section>
</main></div>
</div>

<div id="modal" class="modal"><div class="modal-box"><div class="row space"><h2 id="modalTitle" style="margin:0"></h2><button class="btn secondary" onclick="closeModal()">✕</button></div><div id="modalBody" style="margin-top:16px"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const demo={
  role:'student', name:'Demo Student',
  market:{cap:207368.93,unit:1.03684465,units:200000,turnover:41572.355,portfolio:-65.2,running:-13346.76,expenses:88.5,tax:4373.22,cgt:-3336.6825,promoter:90.90909091},
  profile:{fullName:'Demo Student',mobile:'9876543210',email:'student@example.com',village:'Rewa',district:'Rewa',state:'Madhya Pradesh',pincode:'486001',upi:'student@upi',education:'Graduate',age:25,sex:'Male',father:'Father Name',dob:'2001-01-01',language:'Hindi'},
  tasks:[
    ['Market Basics Quiz','Completed',250,'2026-10-01'],
    ['Candlestick Pattern Notes','Completed',150,'2026-10-03'],
    ['Daily Market Report','Pending',200,'2026-10-08'],
    ['Trade Journal Review','Pending',300,'2026-10-08']
  ],
  partner:{
    invested:20000,return:1250,wallet:4500,withdrawal:1200,fo:430,equity:820,mf:0,
    trades:[['18/09/26','VED CAPITAL UNIT',1.02,1.04,1000,20],['22/09/26','VED CAPITAL UNIT',1.04,1.03,500,-5],['02/10/26','VED CAPITAL UNIT',1.03,1.06,1000,30]]
  }
};

let state={...demo};

function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2300)}
function openModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
 state.role=t.dataset.login;
 document.getElementById('signupBtn').style.display=state.role==='student'?'block':'none';
});
function doLogin(){
 document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';
 document.getElementById('rolePill').textContent=state.role==='student'?'Student/Learner':state.role[0].toUpperCase()+state.role.slice(1);
 document.getElementById('userPill').textContent=state.profile.fullName;
 renderAll(); show('home');
}
function logout(){document.getElementById('app').style.display='none';document.getElementById('login').style.display='grid'}
function toggleSide(){document.getElementById('side').classList.toggle('open')}
function show(id){
 document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');
 document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===id));
 document.getElementById('side').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>show(n.dataset.view));

function renderHome(){
 const role=state.role;
 let title=role==='student'?'Student / Learner Dashboard':role==='partner'?'Partner Dashboard':role==='employee'?'Employee Dashboard':'Admin Control Dashboard';
 let cards='';
 if(role==='student') cards=`
 <div class="g4 grid">
  <div class="card metric"><div class="label">Wallet</div><div class="value blue">${money(850)}</div><span class="tag ok">Available</span></div>
  <div class="card metric"><div class="label">All Income</div><div class="value green">${money(6000)}</div><span class="tag">Task + Promotion</span></div>
  <div class="card metric"><div class="label">Pending Income</div><div class="value">${money(500)}</div><span class="tag pending">Under review</span></div>
  <div class="card metric"><div class="label">Completed Tasks</div><div class="value">2 / 4</div><span class="tag ok">50%</span></div>
 </div>`;
 else if(role==='partner') cards=`
 <div class="g4 grid">
  <div class="card metric"><div class="label">Your Nivesh</div><div class="value">${money(state.partner.invested)}</div></div>
  <div class="card metric"><div class="label">Your Return</div><div class="value green">${money(state.partner.return)}</div></div>
  <div class="card metric"><div class="label">Wallet Amount</div><div class="value blue">${money(state.partner.wallet)}</div></div>
  <div class="card metric"><div class="label">Withdrawal Request</div><div class="value">${money(state.partner.withdrawal)}</div></div>
 </div>`;
 else cards=`
 <div class="g4 grid">
  <div class="card metric"><div class="label">Students</div><div class="value">128</div></div>
  <div class="card metric"><div class="label">Partners</div><div class="value">24</div></div>
  <div class="card metric"><div class="label">Employees</div><div class="value">12</div></div>
  <div class="card metric"><div class="label">Pending Requests</div><div class="value">17</div></div>
 </div>`;
 document.getElementById('home').innerHTML=`
 <div class="hero"><div class="kicker">VED CAPITAL REWA</div><h1>${title}</h1><p>एक ही portal में learning, partner reports, tasks, wallet, payments और management.</p><div class="row"><button class="btn green" onclick="show('reports')">Market Report</button><button class="btn secondary" onclick="show('classes')">Learning Center</button></div></div>
 ${cards}
 <div class="section-title"><h2>Quick Actions</h2></div>
 <div class="action-grid">
  <button class="action" onclick="show('classes')"><span>🎓</span><b>Classes</b><small>Free + Paid</small></button>
  <button class="action" onclick="show('tasks')"><span>📋</span><b>My Tasks</b><small>Income tasks</small></button>
  <button class="action" onclick="show('wallet')"><span>💳</span><b>Wallet</b><small>Add / Withdraw</small></button>
  <button class="action" onclick="show('reports')"><span>📊</span><b>Reports</b><small>Market & trades</small></button>
 </div>
 <div class="section-title"><h2>VED CAPITAL Fundamental Snapshot</h2><button class="btn small" onclick="openModal('Edit Snapshot','<p>Admin can change all figures from Admin Control.</p><button class=btn onclick=toast(\\'Saved\\')>Save</button>')">Admin Edit</button></div>
 <div class="g4 grid">
  ${metric('Total Market Cap',money(state.market.cap),'blue')}${metric('Current Unit Price','₹'+state.market.unit,'green')}${metric('Total Unit Issue',state.market.units)}${metric('Total Traded Fund',money(0))}
  ${metric('Total Pledged Equity',money(0))}${metric('Total Debt',money(55000))}${metric('Portfolio P&L',money(state.market.portfolio),state.market.portfolio<0?'red':'green')}${metric('Total P&L Turnover',money(state.market.turnover))}
 </div>
 <div class="notice" style="margin-top:15px"><b>Production note:</b> यह demo/internal management UI है। Real-money securities trading, investment advice, broker connectivity, KYC/AML, payment settlement और regulatory permissions को production launch से पहले लागू/verify करना होगा.</div>`;
}
function metric(l,v,c=''){return `<div class="card metric"><div class="label">${l}</div><div class="value ${c}">${v}</div></div>`}

function renderProfile(){
 const p=state.profile;
 document.getElementById('profile').innerHTML=`
 <h1>My Profile</h1><p class=sub>Signup में भरी पूरी जानकारी और account status.</p>
 <div class="card"><div class="form-grid">
 ${field('Full Name','fullName',p.fullName)}${field('Mobile Number','mobile',p.mobile)}${field('Email','email',p.email)}${field('UPI ID','upi',p.upi)}
 ${field('Village / Town','village',p.village)}${field('District','district',p.district)}${field('State','state',p.state)}${field('Pincode','pincode',p.pincode)}
 ${field('Higher Education','education',p.education)}${field('Age','age',p.age)}${field('Sex','sex',p.sex)}${field('Father Name','father',p.father)}
 ${field('Date of Birth','dob',p.dob)}${field('Language','language',p.language)}
 <div class=full><button class="btn" onclick="saveProfile()">Save Profile</button></div>
 </div></div>
 <div class=section-title><h2>Account & Verification</h2></div>
 <div class=g3 grid><div class=card><b>Student ID</b><p>VC-STU-10001</p><span class="tag ok">Active</span></div><div class=card><b>KYC</b><p>Admin verification required</p><span class="tag pending">Pending</span></div><div class=card><b>Promotion</b><p>Level: Learner</p><button class="btn small" onclick="toast('Promotion request sent')">Request Promotion</button></div></div>`;
}
function field(label,key,val){return `<div class=field><label>${label}</label><input id="pf_${key}" value="${esc(val)}"></div>`}
function saveProfile(){
 Object.keys(state.profile).forEach(k=>{const x=document.getElementById('pf_'+k);if(x)state.profile[k]=x.value});
 document.getElementById('userPill').textContent=state.profile.fullName;toast('Profile saved');renderProfile();
}
function openSignup(){
 openModal('Student / Learner Signup',`
 <div class="notice">* वाले fields mandatory हैं. Account activation/earning features production में admin verification rules से नियंत्रित किए जा सकते हैं.</div>
 <div class="form-grid" style="margin-top:12px">
 ${field('Full Name','su_name','')}${field('Mobile Number *','su_mobile','')}${field('Email','su_email','')}${field('Address - Village/Town','su_village','')}
 ${field('District','su_dist','')}${field('State','su_state','Madhya Pradesh')}${field('Pincode','su_pin','')}${field('UPI ID','su_upi','')}
 ${field('Higher Education','su_edu','')}${field('Age','su_age','')}${field('Sex','su_sex','')}${field('Father Name','su_father','')}
 ${field('Date of Birth','su_dob','')}${field('Language','su_lang','Hindi')}${field('Password *','su_pass','')}
 <div class=full><button class=btn onclick="createStudent()">Create Student Account</button></div></div>`);
}
function createStudent(){toast('Signup submitted — demo account created');closeModal()}

function renderClasses(){
 document.getElementById('classes').innerHTML=`
 <h1>Classes & Learning</h1><p class=sub>Free saved PDFs/videos/blogs + paid learning library.</p>
 <div class="search"><span>🔎</span><input placeholder="Search candlestick, chart pattern, risk management..." oninput="filterCourses(this.value)"></div>
 <div class=section-title><h2>Free Classes</h2></div><div id=freeCourses class=g3 grid></div>
 <div class=section-title><h2>Paid Classes</h2><span class=tag>₹10 – ₹1200 videos • ₹9 – ₹99 PDF</span></div><div id=paidCourses class=g3 grid></div>
 <div class=section-title><h2>1-to-1 Learning</h2></div>
 <div class=g3 grid>
  <div class=card><div class=kicker>VIDEO CALL</div><h3>Mentor Video Call</h3><p>₹200 / hour</p><button class=btn onclick="toast('Video call request submitted')">Book</button></div>
  <div class=card><div class=kicker>WHATSAPP / ONLINE</div><h3>Personal Guidance</h3><p>Online WhatsApp / Call</p><button class=btn onclick="toast('Guidance request submitted')">Request</button></div>
  <div class=card><div class=kicker>CHAT</div><h3>Chat with Mentor</h3><p>₹10 / minute</p><button class=btn onclick="toast('Chat started in demo')">Start Chat</button></div>
 </div>
 <div class=section-title><h2>Important Patterns</h2></div>
 <div class=g2 grid><div class=card><h3>📈 Chart Patterns</h3><p>Support/Resistance, Breakout, Triangle, Flag, Double Top/Bottom and more.</p></div><div class=card><h3>🕯️ Candlestick Patterns</h3><p>Doji, Hammer, Engulfing, Morning/Evening Star and pattern recognition practice.</p></div></div>`;
 const free=[['Market Basics','PDF + Video','Free'],['Candlestick Basics','Saved PDF + Video','Free'],['Chart Pattern Starter','Blog + Notes','Free']];
 const paid=[['Technical Analysis Masterclass','Video','₹499'],['Advanced Candlestick Course','Video','₹799'],['Chart Pattern Pro','Video','₹1200'],['Candlestick Quick Notes','PDF','₹49'],['Trading Journal Template','PDF','₹9'],['Risk Management Guide','PDF','₹99']];
 renderCourseList('freeCourses',free);renderCourseList('paidCourses',paid);
}
function renderCourseList(id,list){
 document.getElementById(id).innerHTML=list.map((c,i)=>`<div class="card course" data-search="${c.join(' ').toLowerCase()}"><div class=course-icon>${c[1].includes('Video')?'▶':'📄'}</div><div style=flex:1><b>${c[0]}</b><p style="margin:4px 0;color:#7a8494;font-size:12px">${c[1]}</p><span class=price>${c[2]}</span></div><button class="btn small" onclick="toast('${c[2]==='Free'?'Content opened':'Payment checkout opened'}')">${c[2]==='Free'?'Open':'Buy'}</button></div>`).join('');

function drawCandle(){
 const c=document.getElementById('candle');if(!c)return;const ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);
 const vals=[1.01,1.03,1.02,1.06,1.04,1.08,1.07,1.05,1.09,1.12,1.10,1.15,1.13,1.17,1.16,1.20,1.18,1.22];
 const min=1,max=1.24;ctx.strokeStyle='#dfe5ee';ctx.lineWidth=1;
 for(let i=0;i<5;i++){let y=25+i*(h-55)/4;ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(w-15,y);ctx.stroke()}
 vals.forEach((v,i)=>{let x=55+i*(w-85)/(vals.length-1);let prev=i?vals[i-1]:v-.01;let open=prev,close=v,high=Math.max(open,close)+.015,low=Math.min(open,close)-.012;let sy=p=>h-35-(p-min)/(max-min)*(h-65);
 ctx.strokeStyle=close>=open?'#12a873':'#d64545';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(x,sy(low));ctx.lineTo(x,sy(high));ctx.stroke();let top=sy(Math.max(open,close)),bot=sy(Math.min(open,close));ctx.fillRect(x-5,top,10,Math.max(2,bot-top));});
 ctx.fillStyle='#69758a';ctx.font='12px Arial';ctx.fillText('Unit Price',5,18);
}
