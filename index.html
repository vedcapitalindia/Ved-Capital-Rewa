<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Management & Approval System</title>
    <!-- Tailwind CSS for modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Modular Version) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: अपनी Firebase कॉन्फ़िगरेशन यहाँ डालें
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global functions or event listeners can go here or attached to window
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
    </script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-4 max-w-4xl">
        <header class="bg-blue-600 text-white p-4 rounded-lg shadow-md mb-6 flex justify-between items-center">
            <h1 class="text-xl font-bold">Client Approval System</h1>
            <div id="user-info" class="text-sm"></div>
        </header>

        <!-- Login / Role Selection Screen -->
        <div id="login-section" class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-lg font-semibold mb-4">लॉगिन करें (Login)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">नाम:</label>
                    <input type="text" id="login-name" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="अपना नाम दर्ज करें">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">रोल चुनें:</label>
                    <select id="login-role" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                        <option value="employee">Employee (कर्मचारी)</option>
                        <option value="admin">Admin (एडमिन)</option>
                    </select>
                </div>
            </div>
            <button onclick="handleLogin()" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600">लॉगिन करें</button>
        </div>

        <!-- Dashboard Section (Hidden by default) -->
        <div id="dashboard-section" class="hidden">
            
            <!-- Add Client Form (For Employees/Admin) -->
            <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h3 class="text-md font-semibold mb-3">नया क्लाइंट जोड़ें</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="client-name" placeholder="क्लाइंट का नाम" class="border p-2 rounded-md">
                    <input type="text" id="client-phone" placeholder="मोबाइल नंबर" class="border p-2 rounded-md">
                </div>
                <button onclick="addClient()" class="mt-3 bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600">क्लाइंट सेव करें</button>
            </div>

            <!-- Employee Earnings Display -->
            <div id="employee-stats" class="bg-yellow-50 border border-yellow-200 p-4 rounded-lg mb-6 hidden">
                <h3 class="font-semibold text-yellow-800">आपकी कमाई (Earnings Summary)</h3>
                <p>कुल स्वीकृत क्लाइंट (Approved): <span id="emp-approved-count" class="font-bold">0</span></p>
                <p>कुल राशि (₹3 प्रति अप्रूवल): ₹<span id="emp-total-earnings" class="font-bold text-green-600">0</span></p>
            </div>

            <!-- Client List Table -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-md font-semibold mb-3">क्लाइंट्स की सूची (Client List)</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">क्लाइंट नाम</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">मोबाइल</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">जोड़ा गया (By)</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">अप्रूवल स्टेटस</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">पेमेंट स्टेटस (Paid)</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">एक्शन</th>
                            </tr>
                        </thead>
                        <tbody id="client-table-body" class="bg-white divide-y divide-gray-200">
                            <!-- Data will load here dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script type="module">
        let currentUser = null;
        let currentRole = null;

        window.handleLogin = function() {
            const name = document.getElementById('login-name').value.trim();
            const role = document.getElementById('login-role').value;

            if(!name) {
                alert('कृपया अपना नाम दर्ज करें!');
                return;
            }

            currentUser = name;
            currentRole = role;

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-info').innerText = `Logged in as: ${name} (${role.toUpperCase()})`;

            if(role === 'employee') {
                document.getElementById('employee-stats').classList.remove('hidden');
            }

            loadClients();
        }

        window.addClient = async function() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();

            if(!name || !phone) {
                alert('कृपया सभी फील्ड भरें!');
                return;
            }

            try {
                await window.addDoc(window.collection(window.db, "clients"), {
                    name: name,
                    phone: phone,
                    addedBy: currentUser,
                    status: "Pending", // Pending, Approved
                    isPaid: false      // Paid status toggle
                });

                document.getElementById('client-name').value = '';
                document.getElementById('client-phone').value = '';
                alert('क्लाइंट सफलतापूर्वक जुड़ गया!');
                loadClients();
            } catch (e) {
                console.error("Error adding document: ", e);
                alert('डेटा सेव करने में त्रुटि हुई।');
            }
        }

        window.loadClients = async function() {
            const tbody = document.getElementById('client-table-body');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4">लोड हो रहा है...</td></tr>';

            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "clients"));
                tbody.innerHTML = '';
                
                let empApprovedCount = 0;

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.id;
                    const client = docSnap.data();
                    const docId = docSnap.id;

                    // Calculate employee earnings if logged in as employee
                    if(currentRole === 'employee' && client.addedBy === currentUser && client.status === 'Approved') {
                        empApprovedCount++;
                    }

                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-4 py-2">${client.name}</td>
                        <td class="px-4 py-2">${client.phone}</td>
                        <td class="px-4 py-2">${client.addedBy}</td>
                        <td class="px-4 py-2">
                            <span class="px-2 py-1 text-xs rounded ${client.status === 'Approved' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                ${client.status}
                            </span>
                        </td>
                        <td class="px-4 py-2">
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="checkbox" ${client.isPaid ? 'checked' : ''} onchange="togglePaidStatus('${docId}', this.checked)" class="form-checkbox h-4 w-4 text-blue-600">
                                <span class="ml-2 text-sm">${client.isPaid ? 'Paid' : 'Unpaid'}</span>
                            </label>
                        </td>
                        <td class="px-4 py-2">
                            ${currentRole === 'admin' && client.status !== 'Approved' ? `
                                <button onclick="approveClient('${docId}')" class="bg-blue-500 text-white px-2 py-1 rounded text-xs hover:bg-blue-600">Approve</button>
                            ` : ''}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                if(currentRole === 'employee') {
                    document.getElementById('emp-approved-count').innerText = empApprovedCount;
                    document.getElementById('emp-total-earnings').innerText = empApprovedCount * 3;
                }

            } catch (e) {
                console.error("Error loading documents: ", e);
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-red-500">डेटा लोड करने में समस्या आई।</td></tr>';
            }
        }

        window.approveClient = async function(docId) {
            try {
                const clientRef = window.doc(window.db, "clients", docId);
                await window.updateDoc(clientRef, {
                    status: "Approved"
                });
                alert('क्लाइंट अप्रूव कर दिया गया है!');
                loadClients();
            } catch (e) {
                console.error("Error updating document: ", e);
            }
        }

        window.togglePaidStatus = async function(docId, isPaid) {
            try {
                const clientRef = window.doc(window.db, "clients", docId);
                await window.updateDoc(clientRef, {
                    isPaid: isPaid
                });
                loadClients();
            } catch (e) {
                console.error("Error updating paid status: ", e);
            }
        }
    </script>
</body>
</html>
